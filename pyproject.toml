[project]
name = "kaggle-notebook-runner"
version = "0.1.0"
description = "CLI to run Kaggle notebooks with parameters, polling, and output download"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=1.5.16",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "six>=1.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"